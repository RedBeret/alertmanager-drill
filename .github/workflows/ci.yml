name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Bootstrap project environment
        run: ./scripts/bootstrap.sh

      - name: Check the operator environment
        run: ./scripts/lab.sh doctor

      - name: Check entrypoints are executable
        run: |
          test -x scripts/bootstrap.sh
          test -x scripts/lab.sh

      - name: Check shell syntax
        run: |
          bash -n scripts/bootstrap.sh
          bash -n scripts/lab.sh

      - name: Run project tests
        run: ./scripts/lab.sh test

      - name: Lint
        run: ./.venv/bin/ruff check src tests lab

      - name: Build the lab images
        run: docker compose -p alertdrill -f compose.yml build

      # Runs promtool and amtool out of the pinned images, unit tests the rules against
      # synthetic series, and requires the negative fixtures to be rejected.
      - name: Validate rules and configuration
        run: ./scripts/lab.sh validate

  # The static gate above proves the rules parse and behave against synthetic series.
  # This one starts the real stack and pages for real.
  live:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Bootstrap project environment
        run: ./scripts/bootstrap.sh

      - name: Start the drill stack
        run: ./scripts/lab.sh up

      - name: Drill every declared rule
        run: ./scripts/lab.sh drill

      - name: Prove a silence suppresses delivery
        run: ./scripts/lab.sh silence-drill

      - name: Write evidence
        run: ./scripts/lab.sh evidence

      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drill-evidence
          path: artifacts/evidence/
          if-no-files-found: error

      # Always, so a run that fails a gate still leaves nothing behind on the runner.
      - name: Tear down
        if: always()
        run: ./scripts/lab.sh down
